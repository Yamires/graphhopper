name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 17, 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: 'maven'

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Ensure bc and xmllint available
        run: sudo apt-get update && sudo apt-get install -y bc libxml2-utils

      - name: Build all modules ${{ matrix.java-version }}
        run: mvn -B -f pom.xml clean install -DskipTests -Djacoco.skip=true

      - name: Run PIT (incremental)
        if: matrix.java-version == '17'
        run: mvn -B -f pom.xml org.pitest:pitest-maven:mutationCoverage -DargLine="" -DskipTests

      - name: Extract PIT score
        if: matrix.java-version == '17'
        run: |
          file=$(find . -name "mutation.xml" | head -n 1)
          if [ -z "$file" ]; then
            echo "No mutation.xml found."
            exit 1
          fi
          new=$(xmllint --xpath "string(//mutationStats/@mutationCoverage)" "$file")
          echo "Current mutation coverage: $new%"
          echo "$new" > new-score.txt

          if [ -f old-score.txt ]; then
            old=$(cat old-score.txt)
            echo "Previous: $old%"
            echo "Current: $new%"
            if (( $(echo "$new < $old" | bc -l) )); then
              echo "Mutation score decreased"
              exit 1
            fi
          fi
          mv new-score.txt old-score.txt

      - name: Upload PIT history
        if: matrix.java-version == '17' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-history
          path: pitest-history.bin

      - name: Upload PIT score
        if: matrix.java-version == '17' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-score
          path: old-score.txt

      - name: Archive test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 7
