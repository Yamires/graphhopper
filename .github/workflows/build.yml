              if [ -f "$frame" ]; then
                convert "$frame" txt:- 2>/dev/null | awk 'NR>1 {
                  gsub(/.*gray\(/, "", $3);
                  gsub(/\).*/, "", $3);
                  val = int($3 / 25.5);
                  chars = " .:;+=xX      # 🎵 RICKROLL SI RÉGRESSION DÉTECTÉE 🎵
      - name: 🎵 Rickroll on Mutation Regression 🎵
