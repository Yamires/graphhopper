name: Build, Test & PIT
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 24, 25-ea]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bc libxml2-utils

      - name: Make scripts executable
        run: chmod +x .github/workflows/scripts/*.sh

      # Téléchargement des scores PIT du run précédent
      - name: Download previous PIT scores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/workflows/scripts/download-pit-scores.sh \
          "${{ github.workflow }}" \
          "${{ github.ref_name }}" \
          5

      - name: Build all modules
        run: mvn -B clean install -DskipTests -Djacoco.skip=true

      # Détection des modules Maven modifiés
      - name: Detect changed Maven modules
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/pom.xml
            **/src/**

      - name: Compute module list
        id: modules
        run: |
          MODULES=$(.github/workflows/scripts/get-delta.sh "${{ steps.changed.outputs.all_changed_files }}") \
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

      - name: Run PIT mutation testing
        env:
          EXCLUDED_MODULES: "core"
        run: |
          .github/workflows/scripts/run-pit-test.sh "${{ steps.modules.outputs.modules }}"

      # Vérification des scores de mutation par module
      - name: Check mutation coverage regression
        run: .github/workflows/scripts/check-mutation-regression.sh

      # Upload des scores comme artifact (baseline pour le prochain run)
      - name: Upload PIT scores baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-scores-baseline
          path: pit-score-*.txt
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      # Artifacts pour consultation
      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports-java-${{ matrix.java-version }}
          path: '**/target/pit-reports'
          if-no-files-found: ignore
          retention-days: 30

      - name: Archive test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java-version }}
          path: '**/target/surefire-reports'
          retention-days: 7
