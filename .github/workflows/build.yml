name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Download PIT history
        uses: actions/download-artifact@v4
        with:
          name: pit-history
          path: .
        continue-on-error: true

      - name: Download mutation score
        uses: actions/download-artifact@v4
        with:
          name: pit-score
          path: .
        continue-on-error: true

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: Run PIT (incremental)
        run: mvn -q org.pitest:pitest-maven:mutationCoverage

      - name: Extract PIT score
        run: |
          file=$(find . -name "mutation.xml" | head -n 1)
          new=$(xmllint --xpath "string(//mutationStats/@mutationCoverage)" "$file")
          echo "$new" > new-score.txt
          if [ -f old-score.txt ]; then
            old=$(cat old-score.txt)
            echo "Previous: $old"
            echo "Current: $new"
            if (( $(echo "$new < $old" | bc -l )): then
              echo "Mutation score decreased"
              exit 1
            fi
          fi
          mc new-score.txt old-score.txt

      - name: Upload PIT history
        uses: actions/upload-artifact@v4
        with:
          name: pit-history
          path: pitest-history.bin
        if: always()

      - name: Upload PIT score
        uses: actions/upload-artifact@v4
        with:
          name: pit-score
          path: old-score.txt
        if: always()

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

