          echo "║                                                           ║"
          echo "║          🎵  YOU'VE BEEN RICKROLLED!  🎵                 ║"
          echo "║                                                           ║"
          echo "║       ⚠️  MUTATION COVERAGE REGRESSION DETECTED ⚠️       ║"
          echo "║                                                           ║"
          echo "║        Never gonna let those mutants survive! 🦠          ║"
          echo "║                                                           ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          
          # Convertir et afficher quelques frames du GIF en ASCII
          if [ -f rickroll.gif ]; then
            convert rickroll.gif[0-20] -coalesce -resize 60x30 -colorspace Gray frame_%02d.txt 2>/dev/null || true
          
