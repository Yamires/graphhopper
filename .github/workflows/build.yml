name: Build, Test & PIT
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bc libxml2-utils

      - name: Restore previous PIT scores
        uses: actions/cache/restore@v4
        with:
          path: pit-scores-cache
          key: pit-scores-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            pit-scores-${{ github.ref_name }}-
            pit-scores-main-

      - name: Copy cached scores to working directory
        run: |
          if [ -d pit-scores-cache ]; then
            cp pit-scores-cache/*.txt . 2>/dev/null || echo "No cached scores found (first run?)"
          fi

      - name: Build all modules
        run: mvn -B clean install -DskipTests -Djacoco.skip=true

      - name: Detect changed Maven modules
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/pom.xml
            **/src/**

      - name: Compute module list
        id: modules
        run: |
          MODULES=$(echo "${{ steps.changed.outputs.all_changed_files }}" \
            | grep -E '^(core|web|web-api|reader-gtfs|map-matching|tools|client-hc|navigation|example)' \
            | cut -d'/' -f1 | sort -u | tr '\n' ',' | sed 's/,$//')

          if [ -z "$MODULES" ]; then
            echo "No modules changed. Running full build."
            echo "modules=" >> $GITHUB_OUTPUT
          else
            echo "Changed modules: $MODULES"
            echo "modules=$MODULES" >> $GITHUB_OUTPUT
          fi

      - name: Run PIT mutation testing (selective)
        if: steps.modules.outputs.modules != ''
        run: |
          mvn -B org.pitest:pitest-maven:mutationCoverage \
            -pl ${{ steps.modules.outputs.modules }} \
            -DtargetClasses='com.graphhopper.*' \
            -DtargetTests='com.graphhopper.*Test' \
            -DreportsDirectory=target/pit-reports \
            -DoutputFormats=XML,HTML \
            -DtimestampedReports=false

      - name: Run PIT mutation testing (full)
        if: steps.modules.outputs.modules == ''
        run: |
          mvn -B org.pitest:pitest-maven:mutationCoverage \
            -DtargetClasses='com.graphhopper.*' \
            -DtargetTests='com.graphhopper.*Test' \
            -DreportsDirectory=target/pit-reports \
            -DoutputFormats=XML,HTML \
            -DtimestampedReports=false

      - name: Check mutation coverage regression
        run: |
          echo "=== Checking mutation score regression ==="
          failed=false
          
          for file in $(find . -name "mutations.xml"); do
            module=$(echo "$file" | sed 's|^\./||' | cut -d'/' -f1)
          
            # Compte les mutations totales et détectées
            total=$(xmllint --xpath "count(//mutation)" "$file")
            killed=$(xmllint --xpath "count(//mutation[@detected='true'])" "$file")
          
            if [ "$total" -eq 0 ]; then
              echo "⚠$module: No mutations found (skipped)"
              continue
            fi
          
            coverage=$(echo "scale=2; 100 * $killed / $total" | bc -l)
            echo "$module: ${coverage}% ($killed/$total mutations killed)"
          
            # Vérifie si un score précédent existe
            old_file="pit-score-${module}.txt"
            if [ -f "$old_file" ]; then
              old=$(cat "$old_file")
              echo "   Previous: ${old}%"
          
              if (( $(echo "$coverage < $old" | bc -l) )); then
                echo "REGRESSION: Mutation score decreased for $module (${coverage}% < ${old}%)"
                failed=true
              else
                echo "✅ OK: Score maintained or improved"
              fi
            else
              echo "   (No previous score - baseline set)"
            fi
          
            # Sauvegarde le nouveau score
            echo "$coverage" > "$old_file"
          done
          
          if [ "$failed" = true ]; then
            echo ""
            echo "Build failed: one or more modules lost mutation coverage."
            exit 1
          else
            echo ""
            echo "All modules maintained or improved mutation coverage."
          fi

      - name: Save PIT scores to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pit-scores-cache
          key: pit-scores-${{ github.ref_name }}-${{ github.sha }}

      - name: Prepare scores for caching
        if: always()
        run: |
          mkdir -p pit-scores-cache
          cp pit-score-*.txt pit-scores-cache/ 2>/dev/null || true

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports-java-${{ matrix.java-version }}
          path: '**/target/pit-reports'
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload PIT scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-scores-java-${{ matrix.java-version }}
          path: pit-score-*.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Archive test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java-version }}
          path: '**/target/surefire-reports'
          retention-days: 7
