name: Build, Test & PIT
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bc libxml2-utils

      - name: Download previous PIT scores
        uses: actions/download-artifact@v4
        with:
          name: pit-scores
          path: .
        continue-on-error: true

      - name: Build all modules
        run: mvn -B clean install -DskipTests -Djacoco.skip=true

      # 🔍 Détection des modules Maven modifiés
      - name: Detect changed Maven modules
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/pom.xml
            **/src/**

      - name: Compute module list
        id: modules
        run: |
          MODULES=$(echo "${{ steps.changed.outputs.all_changed_files }}" \
            | grep -E '^(core|web|web-api|reader-gtfs|map-matching|tools|client-hc|navigation|example)' \
            | cut -d'/' -f1 | sort -u | tr '\n' ',' | sed 's/,$//')

          if [ -z "$MODULES" ]; then
            echo "No modules changed. Running full build."
            echo "modules=" >> $GITHUB_OUTPUT
          else
            echo "Changed modules: $MODULES"
            echo "modules=$MODULES" >> $GITHUB_OUTPUT
          fi

      - name: Run PIT mutation testing
        if: steps.modules.outputs.modules != ''
        run: |
          mvn -B org.pitest:pitest-maven:mutationCoverage \
            -pl ${{ steps.modules.outputs.modules }} \
            -DtargetClasses='com.graphhopper.*' \
            -DtargetTests='com.graphhopper.*Test' \
            -DreportsDirectory=target/pit-reports \
            -DoutputFormats=XML,HTML \
            -DtimestampedReports=false

      - name: Run PIT (full fallback)
        if: steps.modules.outputs.modules == ''
        run: |
          mvn -B org.pitest:pitest-maven:mutationCoverage \
            -DtargetClasses='com.graphhopper.*' \
            -DtargetTests='com.graphhopper.*Test' \
            -DreportsDirectory=target/pit-reports \
            -DoutputFormats=XML,HTML \
            -DtimestampedReports=false

      - name: Extract PIT score
        if: matrix.java-version == '17'
        run: |
          file=$(find . -name "mutations.xml" | head -n 1)
          if [ -z "$file" ]; then
            echo "No mutations.xml found."
            exit 1
          fi

          total=$(xmllint --xpath "count(//mutation)" "$file")
          killed=$(xmllint --xpath "count(//mutation[@detected='true'])" "$file")

          if [ "$total" -eq 0 ]; then
            echo "No mutations found."
            exit 1
          fi

          new=$(echo "scale=2; 100 * $killed / $total" | bc -l)
          echo "Current mutation coverage: $new%"
          echo "$new" > new-score.txt

          if [ -f old-score.txt ]; then
            old=$(cat old-score.txt)
            echo "Previous: $old%"
            if (( $(echo "$new < $old" | bc -l) )); then
              echo "Mutation score decreased"
              exit 1
            fi
          fi

          mv new-score.txt old-score.txt


      - name: Enforce PIT mutation coverage threshold
        run: |
          echo "=== Checking mutation score regression ==="
          failed=false
          
          for file in $(find . -name "mutations.xml"); do
            module=$(echo "$file" | cut -d'/' -f2)
        
            # Compte les mutations totales et celles détectées
            total=$(xmllint --xpath "count(//mutation)" "$file")
            killed=$(xmllint --xpath "count(//mutation[@detected='true'])" "$file")
        
            if [ "$total" -eq 0 ]; then
              echo "$module: No mutations found."
              continue
            fi
          
            coverage=$(echo "scale=2; 100 * $killed / $total" | bc -l)
            echo "$module: $coverage%"
          
            old_file="pit-score-${module}.txt"
            if [ -f "$old_file" ]; then
              old=$(cat "$old_file")
              echo "Previous: $old%"
              if (( $(echo "$coverage < $old" | bc -l) )); then
                echo " Mutation score decreased for module $module"
                failed=true
              fi
            fi
          
            echo "$coverage" > "$old_file"
          done
            
          if [ "$failed" = true ]; then
            echo "Build failed: one or more modules lost mutation coverage."
            exit 1
          else
            echo "All modules maintained or improved mutation coverage."
          fi


      - name: Upload PIT scores
        uses: actions/upload-artifact@v4
        with:
          name: pit-scores
          path: pit-score-*.txt
          if-no-files-found: ignore

      - name: Upload PIT reports
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: '**/target/pit-reports'
          if-no-files-found: ignore

      - name: Archive test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 7

