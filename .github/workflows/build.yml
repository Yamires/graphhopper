        if: failure() && steps.pit-test.outcome == 'failure'
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║                                                           ║"
          echo "║          🎵  YOU'VE BEEN RICKROLLED!  🎵                 ║"
          echo "║                                                           ║"
          echo "║              ❌  TESTS FAILED  ❌                         ║"
          echo "║                                                           ║"
          echo "║        Never gonna give you up on fixing this! 🔧         ║"
          echo "║                                                           ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          echo "🎵 Never gonna give you up"
          echo "🎵 Never gonna let you down"
