                }' 2>/dev/null || true
                sleep 0.1
              fi
            done
          fi
          
          echo ""
          echo "🎵 Never gonna give you up"
          echo "🎵 Never gonna let you down"
          echo "🎵 Never gonna run around and desert you"
          echo ""
          echo "🔨 Fix those tests! https://youtu.be/dQw4w9WgXcQ"
          echo ""

      - name: 🎵 Rickroll Summary on Test Failure 🎵
        if: failure() && steps.pit-test.outcome == 'failure'
        run: |
          echo "# 🎵 TESTS FAILED - YOU GOT RICKROLLED! 🎵" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "![Rickroll](https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ❌ Some tests didn't pass!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Time to debug and fix! 🔧" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🕺 Never gonna give you up" >> $GITHUB_STEP_SUMMARY
          echo "### 💃 Never gonna let you down" >> $GITHUB_STEP_SUMMARY
          echo "### 🔨 Never gonna give up on fixing this" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Watch for motivation](https://youtu.be/dQw4w9WgXcQ) 🎵" >> $GITHUB_STEP_SUMMARY

      # Upload des scores comme artifact (baseline pour le prochain run)
      - name: Upload PIT scores baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-scores-baseline
          path: pit-score-*.txt
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      # Artifacts pour consultation
      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports-java-${{ matrix.java-version }}
          path: '**/target/pit-reports'
          if-no-files-found: ignore
          retention-days: 30

      - name: Archive test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java-version }}
          path: '**/target/surefire-reports'
          retention-days: 7
