name: Build, Test & PIT (GraphHopper)
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bc libxml2-utils

      - name: Build all modules
        run: mvn -B clean install -DskipTests -Djacoco.skip=true

      - name: Run PIT on each module
        run: |
          declare -A MODULES
          MODULES["core"]="com.graphhopper.*"
          MODULES["map-matching"]="com.graphhopper.matching.*"
          MODULES["navigation"]="com.graphhopper.navigation.*"
          MODULES["reader-gtfs"]="com.graphhopper.reader.*"
          MODULES["tools"]="com.graphhopper.tools.*"
          MODULES["web"]="com.graphhopper.http.*"
          MODULES["web-api"]="com.graphhopper.util.*"

          for module in "${!MODULES[@]}"; do
            echo "Running PIT for module: $module"
            mvn -B -pl "$module" -am org.pitest:pitest-maven:mutationCoverage \
              -DtargetClasses="${MODULES[$module]}" \
              -DtargetTests='com.graphhopper.*Test' \
              -DreportsDirectory="$module/target/pit-reports" \
              -DtimestampedReports=false \
              -DskipTests || true
          done

      - name: Summarize PIT results
        run: |
          total=0
          count=0
          echo "=== PIT Mutation Coverage Summary ==="
          for file in $(find . -name "mutation.xml"); do
            module=$(echo "$file" | cut -d'/' -f2)
            coverage=$(xmllint --xpath "string(//mutationStats/@mutationCoverage)" "$file")
            echo " $module: $coverage%"
            total=$(echo "$total + $coverage" | bc -l)
            count=$((count + 1))
          done
          if [ "$count" -gt 0 ]; then
            avg=$(echo "scale=2; $total / $count" | bc -l)
            echo "Average coverage: $avg%"
          else
            echo "No mutation.xml files found."
          fi

      - name: Upload PIT reports
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: |
            core/target/pit-reports
            map-matching/target/pit-reports
            navigation/target/pit-reports
            reader-gtfs/target/pit-reports
            tools/target/pit-reports
            web/target/pit-reports
            web-api/target/pit-reports

      - name: Archive test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 7

