          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ Mutation Coverage Regression Detected!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Some mutants survived that shouldn't have. Time to fix those tests!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🕺 Never gonna give you up" >> $GITHUB_STEP_SUMMARY
          echo "### 💃 Never gonna let you down" >> $GITHUB_STEP_SUMMARY
          echo "### 🎶 Never gonna run around and desert you" >> $GITHUB_STEP_SUMMARY
