name: Rickroll on Failure

on:
  workflow_run:
    workflows: ["Build, Test & PIT"]
    types:
      - completed

jobs:
  rickroll:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install yt-dlp

      # Télécharger la vidéo Rickroll
      - name: Download Rickroll video
        run: |
          yt-dlp -f "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            -o "rickroll.mp4" \
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

      # Extraire les frames depuis le Rickroll.mp4
      - name: Extract frames
        run: |
          mkdir frames
          ffmpeg -i rickroll.mp4 -vf "scale=60:30,fps=12" -t 10 frames/frame_%03d.png

      # Créer un mini-projet Rust
      - name: Create Rust player
        run: |
          mkdir -p ascii_anim/src
          cat << 'EOF' > ascii_anim/Cargo.toml
          [package]
          name = "ascii_anim"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          image = "0.24"
          EOF

          cat << 'EOF' > ascii_anim/src/main.rs
          use std::{thread, time::Duration};
          use image::GenericImageView;

          fn frame_to_ascii(path: &str) {
              let img = image::open(path).unwrap();
              let (w, h) = img.dimensions();
              let chars = [" ", ".", ":", "-", "=", "+", "*", "#", "%", "@"];

              for y in 0..h {
                  for x in 0..w {
                      let pixel = img.get_pixel(x, y);
                      let luminance = (0.2126 * pixel[0] as f32
                                     + 0.7152 * pixel[1] as f32
                                     + 0.0722 * pixel[2] as f32) / 255.0;
                      let idx = (luminance * 9.0).round() as usize;
                      print!("{}", chars[idx]);
                  }
                  println!();
              }
          }

          fn main() {
              // Compter le nombre de frames disponibles
              let mut frame_count = 0;
              for i in 1..1000 {
                  if std::path::Path::new(&format!("frames/frame_{:03}.png", i)).exists() {
                      frame_count = i;
                  } else {
                      break;
                  }
              }

              println!("🎵 Never gonna give you up... 🎵\n");
          
              for i in 1..=frame_count {
                  print!("\x1B[2J\x1B[1;1H");
                  frame_to_ascii(&format!("frames/frame_{:03}.png", i));
                  thread::sleep(Duration::from_millis(83));
              }
          
              println!("\n🎉 You just got rickrolled! 🎉");
          }
          EOF

      # Installer Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Compiler le programme Rust
      - name: Compile ASCII player
        run: |
          cd ascii_anim
          cargo build --release
          cp target/release/ascii_anim ../app

      # Exécuter le Rick Astley ASCII 🎉
      - name: Run Rickroll
        run: ./app
